name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        run: npm install -g pnpm@11.16.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
          
      - name: Run lint
        run: pnpm lint
        
      - name: Run typecheck
        run: pnpm typecheck
        
      - name: Run tests
        run: pnpm test
        
      - name: Run build
        run: pnpm build